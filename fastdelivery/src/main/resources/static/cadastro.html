<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastDelivery - Cadastro</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html">Fast<span>Delivery</span></a><nav><a href="index.html">Restaurantes</a><a href="login.html">Login</a></nav></header>
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-head"><div class="logo-badge">FD</div><h1>Crie sua conta</h1><p>Cadastre-se para pedir seus pratos favoritos.</p></div>
    <form id="cadastro-form">
      <div class="form-grid">
        <div class="field"><label>Nome completo</label><input required placeholder="Ex.: João da Silva"></div>
        <div class="field"><label>Telefone</label><input required placeholder="(81) 99999-9999"></div>
      </div>
      <div class="field"><label>E-mail</label><input type="email" required placeholder="voce@email.com"></div>
      <div class="field"><label>Senha</label><input type="password" required placeholder="Crie uma senha"></div>
      <div class="field"><label>Confirmar senha</label><input type="password" required placeholder="Repita a senha"></div>
      <label class="check"><input type="checkbox" required> Aceito os termos de uso e a política de privacidade.</label>
      <button class="btn full" type="submit">Cadastrar</button>
    </form>
    <p class="switch">Já possui conta? <a href="login.html">Entrar agora</a></p>
  </div>
</main>
<script src="js/app.js"></script>
</body>
</html>
