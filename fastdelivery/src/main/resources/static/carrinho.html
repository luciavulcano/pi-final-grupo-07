<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>FastDelivery - Meu Carrinho</title>

  <link
    rel="stylesheet"
    href="css/style.css">

</head>

<body>

  <header class="topbar">

    <a
      class="brand"
      href="index.html">

      Fast<span>Delivery</span>

    </a>

    <nav>

      <a href="index.html">
        Restaurantes
      </a>

      <a href="login.html" id="login-link">
        Login
      </a>

      <span
        id="usuario-logado"
        style="display:none;">

        Olá,
        <strong id="nome-usuario"></strong>

      </span>

      <button
        id="logout-btn"
        class="nav-logout"
        type="button"
        style="display:none;"
        onclick="logout()">

        Sair

      </button>

      <a
        href="carrinho.html"
        class="nav-cart">

        🛒
        <span id="cart-count">0</span>

      </a>

    </nav>

  </header>


  <main class="container">

    <div class="section-title">

      <div>

        <span class="eyebrow">
          Seu pedido
        </span>

        <h1>
          Meu carrinho
        </h1>

      </div>

      <a
        href="index.html"
        class="btn">

        Continuar comprando

      </a>

    </div>


    <section
      id="cart-page"
      class="panel">

      <div
        id="cart-items">
      </div>

      <div
        id="cart-empty"
        class="empty-cart"
        style="display:none;">

        <div class="restaurant-icon">
          🛒
        </div>

        <h2>
          Seu carrinho está vazio
        </h2>

        <p class="muted">
          Escolha um restaurante e adicione
          seus produtos favoritos.
        </p>

        <a
          href="index.html"
          class="btn">

          Ver restaurantes

        </a>

      </div>


      <div
        id="cart-footer"
        style="display:none;">

        <hr>

        <div class="summary-total">

          <span>
            Total
          </span>

          <strong id="cart-total">
            R$ 0,00
          </strong>

        </div>

        <div class="cart-actions">

          <a
            href="index.html"
            class="btn">

            Continuar comprando

          </a>

          <a
            href="pagamento.html"
            class="btn full">

            Finalizar pedido

          </a>

        </div>

      </div>

    </section>

  </main>


  <script src="js/app.js"></script>

</body>

</html>
