<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FastDelivery - Restaurantes</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="topbar">

    <a class="brand" href="index.html">
      Fast<span>Delivery</span>
    </a>

    <nav>

      <a href="cadastro.html">Cadastro</a>

      <a href="login.html" id="login-link">Login</a>

      <span id="usuario-logado" style="display: none;">
        Olá, <strong id="nome-usuario"></strong>
      </span>

      <button
        id="logout-btn"
        class="nav-logout"
        type="button"
        style="display: none;"
        onclick="logout()">
        Sair
      </button>

      <a href="carrinho.html" class="nav-cart">
        🛒 <span id="cart-count">0</span>
      </a>

    </nav>

  </header>

  <main class="container home-page">

    <section class="hero">

      <h1>Encontre seu restaurante</h1>

      <form
        class="search"
        onsubmit="event.preventDefault(); filterRestaurants();">

        <label for="busca">Pesquisa</label>

        <input
          id="busca"
          type="search"
          placeholder="Digite o nome do restaurante">

        <button class="btn" type="submit">
          Buscar
        </button>

      </form>

      <div class="chips">

        <button onclick="setCategory('Hambúrguer')">
          Hambúrguer
        </button>

        <button onclick="setCategory('Pizza')">
          Pizza
        </button>

        <button onclick="setCategory('Japonesa')">
          Japonesa
        </button>

        <button onclick="setCategory('Brasileira')">
          Brasileira
        </button>

      </div>

    </section>

    <section>

      <div class="section-title">

        <h2>Restaurantes próximos</h2>

        <a href="produtos.html">
          Ver todos
        </a>

      </div>

      <div
        id="restaurants"
        class="restaurant-grid">
      </div>

    </section>

  </main>

  <script src="js/app.js"></script>

</body>

</html>
